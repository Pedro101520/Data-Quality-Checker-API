name: CI/CD - Data Quality Checker

on:
  push:
    branches:
      - "feature/*"
      - main
    pull_request:
      branches:
        - main

jobs:
  ci:
    name: CI - Testes
    runs-on: ubuntu=latest

    steps:
      - name: Checkout do código
      - uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Instalar dependências
        run: pip install -r requirements.txt
      
      - name: Testes com pytest
        run: pytest tests/ -v5
      
      - name: Cobertura com pytest-cov
        run: pytest tests/ --cov=src --cov-report=term-missing

cd:
  - name: Checkout do código
    uses: actions/checkout@v7

  - name: Configurar credenciais AWS
    uses: aws-actions/configura-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secrets-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}
  
  - name: Login no Amazon ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2
  
  - name: Build e push da imagem Docker
    env:
      ECR_URI: ${{ secrets.ECR_REPOSITORY_URI }}
      IMAGE_TAG: ${{ github.sha }}
    run: |
      docker build -t $ECR_URI:$IMAGE_TAG
      docker push $ECR_URI:$IMAGE_TAG
  
  - name: Deploy no App Runner
    env:
      ECR_URI: ${{ secrets.ECR_REPOSITORY_URI }}
      IMAGE_TAG: ${{ github.sha }}
    run: |
      aws apprunner update-service \
        --service-arn ${{ secrets.APP_RUNNER_SERVICE_ARN }} \
        --source-configuration '{
          "ImageRepository": {
            "ImageIdentifier": "'"$ECR_URI:$IMAGE_TAG"'",
            "ImageRepositoryType": "ECR"
          }
        }'